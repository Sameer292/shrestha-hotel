# ============================================================
# DEV ONLY — local WordPress + Caddy on :8081 (any DB is fine).
# Prod on Hestia uses docker-compose.hestia.yml (app container only).
# ============================================================
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shrestha_cms
      MYSQL_USER: shrestha
      MYSQL_PASSWORD: shrestha_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: shrestha
      WORDPRESS_DB_PASSWORD: shrestha_pass
      WORDPRESS_DB_NAME: shrestha_cms
      WORDPRESS_DEBUG: "1"
      # Home URL is set dynamically in mu-plugins/shrestha-settings.php
      # (follows the request host, whitelisted) so LAN IPs work too.
      # Revalidate hook target (Next dev on host) + shared secret with .env.local
      NEXT_APP_URL: http://host.docker.internal:3000
      REVALIDATE_SECRET: dev-secret-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp_data:/var/www/html

  # Single-port entry: :80 → app (host :3000) + CMS, mirroring prod
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8081:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # one-shot WP-CLI helper — run `docker compose run --rm wpcli <cmd>`
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - wp_data:/var/www/html
    entrypoint: wp
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: shrestha
      WORDPRESS_DB_PASSWORD: shrestha_pass
      WORDPRESS_DB_NAME: shrestha_cms
    command: --info

volumes:
  db_data:
  wp_data:
  caddy_data:
